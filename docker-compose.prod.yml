services:
  postgres:
    image: postgres:16
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ecommerce-rabbitmq
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/leonardogalvaotoffoli/ecommerce-api-backend:latest}
    container_name: ecommerce-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_RABBITMQ_HOST: rabbitmq
    networks:
      - internal

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/leonardogalvaotoffoli/ecommerce-api-frontend:latest}
    container_name: ecommerce-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - internal
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_default"
      # roteador HTTP redireciona pra HTTPS
      - "traefik.http.routers.camisaria-http.rule=Host(`store.paglamp.com.br`)"
      - "traefik.http.routers.camisaria-http.entrypoints=web"
      - "traefik.http.routers.camisaria-http.middlewares=camisaria-https-redirect"
      - "traefik.http.middlewares.camisaria-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.camisaria-https-redirect.redirectscheme.permanent=true"
      # roteador HTTPS com TLS via leresolver (Let's Encrypt)
      - "traefik.http.routers.camisaria.rule=Host(`store.paglamp.com.br`)"
      - "traefik.http.routers.camisaria.entrypoints=websecure"
      - "traefik.http.routers.camisaria.tls=true"
      - "traefik.http.routers.camisaria.tls.certresolver=leresolver"
      - "traefik.http.services.camisaria.loadbalancer.server.port=80"

networks:
  internal:
  traefik:
    name: traefik_default
    external: true

volumes:
  pgdata:
